[theme]
# Tema nativo de Streamlit — reemplaza ~250 líneas de CSS inyectado.
# Al definirlo aquí, el motor de temas de Streamlit genera los estilos
# correctos para TODOS los widgets (inputs, selectbox, multiselect,
# date_input, etc.) sin necesidad de pelear con !important ni JavaScript.
base = "light"
primaryColor = "#E57373"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F2F2F2"
textColor = "#111111"
font = "sans serif"

[client]
# Antes: true. Cualquier error mostraba la traza de Python completa a
# quien estuviera usando la app -- rutas del servidor, nombres de tabla y
# el fragmento de consulta que falló. El personal no puede hacer nada con
# eso y a un extraño le sirve de mapa. Los errores siguen apareciendo en
# los logs de Streamlit Cloud, que es donde hay que mirarlos.
showErrorDetails = false
toolbarMode = "minimal"

[server]
enableStaticServing = true
